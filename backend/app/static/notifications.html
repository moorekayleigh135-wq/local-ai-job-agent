<!doctype html>

<head>
  <meta charset="utf-8">

  <title>Job alerts — JobHarbor</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#21382f;background:#f4f5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px}.shell{max-width:880px;margin:28px auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-size:16px;font-weight:750}.links{display:flex;gap:16px}.back{color:#597763;text-decoration:none;font-size:12px;font-weight:650}.intro{margin-bottom:22px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#71876e;font-weight:700}h1{font-size:29px;letter-spacing:-.8px;margin:7px 0}.sub{font-size:12px;color:#7b857e;line-height:1.6;margin:7px 0 0}.panel{background:white;border:1px solid #e4e8df;border-radius:16px;padding:21px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#738078;font-size:11px}.toolbar label{display:flex;align-items:center;gap:7px;cursor:pointer}.notice{border-top:1px solid #edf0ea;padding:17px 0;display:grid;grid-template-columns:54px 1fr auto;gap:13px;align-items:start}.notice:first-child{border-top:0}.score{width:50px;height:50px;border-radius:14px;background:#e6f3ed;color:#21755c;display:grid;place-items:center;font-size:13px;font-weight:800}.title{font-size:13px;font-weight:750;line-height:1.45}.meta{font-size:10px;color:#718078;margin-top:3px}.tip{font-size:11px;color:#68766d;margin-top:7px;line-height:1.5}.terms{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.term{background:#f1f5f1;color:#52685b;border-radius:999px;padding:4px 7px;font-size:9px}.actions{display:flex;gap:11px;align-items:center;margin-top:9px}.actions a,.actions button{font:inherit;font-size:10px;font-weight:700;color:#28765b;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}.empty{padding:44px 16px;text-align:center;color:#78837c;font-size:12px;line-height:1.6}.empty strong{display:block;color:#283c32;font-size:14px;margin-bottom:6px}.error{color:#9a4339}.count{background:#e6f3ed;color:#21755c;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:700}
    .enable-alerts{background:#450084;color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}.enable-alerts:disabled{background:#eee7f5;color:#39214e}.toolbar{gap:12px;flex-wrap:wrap}.notice{grid-template-columns:54px minmax(0,1fr)}.notice .actions{grid-column:2}.meta{line-height:1.5}
    @media(max-width:620px){body{padding:15px}.shell{margin:12px auto}.top{align-items:flex-start}.links{gap:10px;flex-wrap:wrap;justify-content:flex-end}.notice{grid-template-columns:44px minmax(0,1fr);gap:10px}.score{width:42px;height:42px}.notice .actions{grid-column:2;margin-top:0}.panel{padding:15px}}
  </style>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="with-app-sidebar">
  <aside class="app-sidebar" aria-label="Main navigation"><div class="app-brand"><span class="app-brand-mark" aria-hidden="true">JH</span>JobHarbor</div><nav>
    <a href="/"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="11" width="7" height="10" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>Overview</a>
    <a href="/opportunities"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></svg>Opportunities</a>
    <a href="/assets/profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Career profile</a>
    <a href="/assets/scanner.html"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>Company search</a>
    <a href="/notifications" aria-current="page"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>Alerts</a>
    <a href="/account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Account</a>

  </nav></aside>

  <main class="shell">
    <div class="page-context">Workspace <span>/</span> Alerts</div><section class="page-heading"><h1>Alerts</h1><p>Review new roles that meet your match threshold and notification preferences.</p></section>
    <section class="panel"><div class="toolbar"><span id="summary">Loading your alerts…</span><label><input id="show-all" type="checkbox">Show read alerts</label><button class="enable-alerts" id="enable-alerts" type="button">Enable phone &amp; desktop alerts</button></div><p class="tip" id="push-status" role="status">Alerts are stored locally. Enable notifications separately on each device.</p><div id="alerts"></div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s);let notices=[];let knownIds=null;let pushConfig={enabled:false};let deviceAlertsEnabled=localStorage.getItem('jobharbor-device-alerts')==='on';let pushSubscriptionId=localStorage.getItem('jobharbor-push-subscription');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const asUtcDate=value=>new Date(/[zZ]|[+-]\d\d:\d\d$/.test(value)?value:`${value}Z`);
    async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok){const body=await r.json().catch(()=>({}));throw Error(body.detail||'Could not load alerts.')}return r.status===204?null:r.json()}
    function render(){const showAll=$('#show-all').checked;const visible=showAll?notices: notices.filter(n=>!n.read_at);const unread=notices.filter(n=>!n.read_at).length;$('#summary').innerHTML=`<span class="count">${unread} unread</span> &nbsp; ${visible.length} shown`;if(!visible.length){$('#alerts').innerHTML='<div class="empty"><strong>No new job alerts.</strong>New qualifying roles appear here after the next company scan.</div>';return}$('#alerts').innerHTML=visible.map(n=>{const date=n.posted_at?n.posted_at:n.created_at;const when=n.posted_at?'Posted':'First detected';const dateText=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(asUtcDate(date));return `<article class="notice"><div class="score">${n.match_score}%</div><div><div class="title">${esc(n.job_title||'Untitled opportunity')}</div><div class="meta">${esc(n.company||'Company')} · ${esc(n.recommendation)} · ${when} ${esc(dateText)}</div><p class="tip">${esc(n.recommendation_tip)}</p>${n.matched_terms?.length?`<div class="terms">${n.matched_terms.map(t=>`<span class="term">${esc(t)}</span>`).join('')}</div>`:''}<div class="actions">${n.source_url?`<a href="${esc(n.source_url)}" target="_blank" rel="noopener noreferrer">View posting ↗</a>`:''}${n.read_at?'':'<button data-read="'+n.id+'">Mark as read</button>'}</div></div></article>`}).join('');document.querySelectorAll('[data-read]').forEach(b=>b.addEventListener('click',()=>markRead(Number(b.dataset.read))))}
    async function notifyNew(notice){if(!deviceAlertsEnabled||Notification.permission!=='granted')return;try{const registration=await navigator.serviceWorker.ready;await registration.showNotification(`New job match · ${notice.match_score}%`,{body:`${notice.job_title||'New opportunity'} · ${notice.company||'Company'}`,icon:'/assets/jobharbor-icon.svg',tag:`jobharbor-alert-${notice.id}`,data:{url:notice.source_url||'/notifications'}})}catch(e){console.warn('Could not show browser alert',e)}}
    async function load(){try{notices=await api(`/scanner/notifications?unread_only=${!$('#show-all').checked}&limit=100`);const ids=new Set(notices.map(n=>n.id));if(knownIds!==null){for(const n of notices)if(!knownIds.has(n.id))notifyNew(n)}knownIds=ids;render()}catch(e){$('#summary').textContent='';$('#alerts').innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
    async function markRead(id){try{await api(`/scanner/notifications/${id}/read`,{method:'POST'});await load()}catch(e){$('#summary').textContent=e.message}}
    function decodeKey(value){const normalized=value.replace(/-/g,'+').replace(/_/g,'/');const raw=atob(normalized+'='.repeat((4-normalized.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
    async function refreshPush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))return;await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});pushConfig=await api('/scanner/push-config');const registration=await navigator.serviceWorker.ready;const subscription=await registration.pushManager.getSubscription();if(pushConfig.enabled&&subscription){const saved=await api('/scanner/push-subscriptions',{method:'POST',body:JSON.stringify(subscription)});pushSubscriptionId=saved.subscription_id;localStorage.setItem('jobharbor-push-subscription',pushSubscriptionId);deviceAlertsEnabled=true;localStorage.setItem('jobharbor-device-alerts','on')}if(deviceAlertsEnabled&&Notification.permission==='granted'){$('#enable-alerts').textContent='Disable alerts on this device';$('#push-status').textContent=pushConfig.enabled?'Phone and desktop push is enabled, including when this page is closed.':'Browser notifications work while this page is open. Configure Web Push keys and HTTPS to receive alerts with the page closed.'}}catch(e){$('#push-status').textContent=e.message}}
    async function enableAlerts(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('This browser does not support Web Push.');if(!window.isSecureContext)throw Error('Phone push needs a secure HTTPS address.');const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Notification permission was not granted.');const registration=await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});pushConfig=await api('/scanner/push-config');deviceAlertsEnabled=true;localStorage.setItem('jobharbor-device-alerts','on');if(pushConfig.enabled){let subscription=await registration.pushManager.getSubscription();if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(pushConfig.public_key)});const saved=await api('/scanner/push-subscriptions',{method:'POST',body:JSON.stringify(subscription)});pushSubscriptionId=saved.subscription_id;localStorage.setItem('jobharbor-push-subscription',pushSubscriptionId);$('#push-status').textContent='Phone and desktop push is enabled, including when this page is closed.'}else{$('#push-status').textContent='Browser alerts are enabled while this page stays open. Server Web Push keys and HTTPS are needed for alerts when the page is closed.'}$('#enable-alerts').textContent='Disable alerts on this device';load()}catch(e){$('#push-status').textContent=e.message}}
    async function disableAlerts(){try{const registration=await navigator.serviceWorker.getRegistration('/');const subscription=registration&&await registration.pushManager.getSubscription();if(subscription)await subscription.unsubscribe();if(pushSubscriptionId)await api(`/scanner/push-subscriptions/${pushSubscriptionId}`,{method:'DELETE'});deviceAlertsEnabled=false;localStorage.removeItem('jobharbor-device-alerts');localStorage.removeItem('jobharbor-push-subscription');pushSubscriptionId=null;$('#enable-alerts').textContent='Enable phone & desktop alerts';$('#push-status').textContent='Browser alerts are disabled on this device.'}catch(e){$('#push-status').textContent=e.message}}
    $('#enable-alerts').addEventListener('click',()=>deviceAlertsEnabled?disableAlerts():enableAlerts());
    refreshPush();
    $('#show-all').addEventListener('change',load);load();setInterval(load,30000);
  </script>
</body>
