<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5ef">
  <title>Sign in — JobHarbor</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#21382f;background:#f4f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);background:#fff;border:1px solid #e4e8df;border-radius:20px;padding:34px;box-shadow:0 18px 50px #1d362414}.brand{font-size:17px;font-weight:750;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;margin-bottom:28px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#e8f0e6;color:#496e52;font-size:20px}h1{font-size:25px;letter-spacing:-.8px;margin:0 0 8px}p{color:#758078;font-size:13px;line-height:1.6;margin:0 0 24px}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:12px;font-weight:650;color:#45584d}.field input{font:inherit;font-size:14px;padding:12px 13px;border:1px solid #dfe5dc;border-radius:10px;outline:none}.field input:focus{border-color:#64876c;box-shadow:0 0 0 3px #64876c20}.button{border:0;background:#365c45;color:#fff;border-radius:10px;padding:13px 16px;font:inherit;font-size:13px;font-weight:650;width:100%;cursor:pointer;margin-top:6px}.button:disabled{opacity:.65;cursor:wait}.muted{background:#edf1ea;color:#385444;margin-top:10px}.message{min-height:20px;font-size:12px;color:#9a4339;margin:12px 0 0}.message.ok{color:#426c4c}.foot{font-size:11px;color:#879088;line-height:1.6;margin:20px 0 0;padding-top:17px;border-top:1px solid #edf0ea}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">⌂</span>JobHarbor</div>
    <h1 id="title">Sign in to your workspace</h1>
    <p id="intro">Your local job search and career profile are available after you sign in.</p>
    <form id="login-form" class="hidden">
      <div class="field"><label for="login-user">Username</label><input id="login-user" name="username" autocomplete="username" required maxlength="80"></div>
      <div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="256"></div>
      <button class="button" type="submit">Sign in</button>
    </form>
    <form id="register-form" class="hidden">
      <div class="field"><label for="new-user">Create username</label><input id="new-user" name="username" autocomplete="username" required minlength="3" maxlength="80" pattern="[A-Za-z0-9_.-]+" title="Use letters, numbers, dots, underscores, or hyphens."></div>
      <div class="field"><label for="new-password">Create password</label><input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"><small style="color:#7d887f;font-size:11px">Use at least 12 characters.</small></div>
      <button class="button" type="submit">Create local user</button>
    </form>
    <button id="switch-mode" class="button muted hidden" type="button"></button>
    <div id="message" class="message" role="status"></div>
    <div class="foot">This is a single-user, local installation. Your password is stored as an Argon2 hash. Create the first account once; after that, sign in to this workspace.</div>
  </main>
  <script>
    const $=s=>document.querySelector(s), login=$('#login-form'), register=$('#register-form'), toggle=$('#switch-mode');
    function showMessage(text,ok=false){const e=$('#message');e.textContent=text;e.className='message'+(ok?' ok':'')}
    function mode(create){login.classList.toggle('hidden',create);register.classList.toggle('hidden',!create);toggle.classList.remove('hidden');toggle.textContent=create?'I already have a user':'Create local user';$('#title').textContent=create?'Create your local user':'Sign in to your workspace';$('#intro').textContent=create?'Set up the account for this private JobHarbor installation.':'Your local job search and career profile are available after you sign in.';showMessage('')}
    async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=r.status===204?{}:await r.json();if(!r.ok)throw Error(value.detail||'Could not complete the request.');return value}
    toggle.addEventListener('click',()=>mode(register.classList.contains('hidden')));
    login.addEventListener('submit',async e=>{e.preventDefault();const b=login.querySelector('button');b.disabled=true;try{await api('/auth/login',{username:$('#login-user').value,password:$('#login-password').value});location.assign('/')}catch(error){showMessage(error.message)}finally{b.disabled=false}});
    register.addEventListener('submit',async e=>{e.preventDefault();const b=register.querySelector('button');b.disabled=true;try{await api('/auth/register',{username:$('#new-user').value,password:$('#new-password').value});location.assign('/')}catch(error){showMessage(error.message)}finally{b.disabled=false}});
    fetch('/auth/status').then(r=>r.json()).then(state=>{if(state.authenticated)location.replace('/');else mode(state.setup_required)}).catch(()=>showMessage('Could not reach the local service. Refresh after JobHarbor is running.'));
  </script>
</body>
</html>
